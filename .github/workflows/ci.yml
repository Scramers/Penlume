name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Use a canonical Windows test directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path $env:RUNNER_TEMP -Force | Out-Null
          $canonicalTemp = node -e "console.log(require('fs').realpathSync(process.env.RUNNER_TEMP))"
          "TMP=$canonicalTemp" >> $env:GITHUB_ENV
          "TEMP=$canonicalTemp" >> $env:GITHUB_ENV
      - run: npm run setup:pandoc:win
      - run: npm test -- --testTimeout=15000 --hookTimeout=15000
      - run: npm run build
      - run: npm run licenses:collect
